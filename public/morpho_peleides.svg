<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="forestDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a10"/>
      <stop offset="50%" stop-color="#062b1b"/>
      <stop offset="100%" stop-color="#010e08"/>
    </linearGradient>
    <radialGradient id="wingGlow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="25%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="electricBlue" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <filter id="morphoFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#forestDark)"/>

  <!-- Sunbeam Filter Effect in Tropical Rainforest -->
  <polygon points="100,0 250,0 450,600 200,600" fill="#22c55e" opacity="0.06"/>
  <polygon points="350,0 520,0 720,600 500,600" fill="#38bdf8" opacity="0.05"/>

  <!-- Morpho peleides Butterfly Opened Wings -->
  <g filter="url(#morphoFilter)" transform="translate(400, 310)">
    <!-- LEFT WINGS -->
    <!-- Forewing Left -->
    <path d="M 0,-40 C -80,-180 -260,-230 -330,-150 C -380,-90 -310,20 -200,60 C -120,80 -50,50 0,0 Z" fill="#090d16"/>
    <path d="M -15,-35 C -80,-165 -245,-215 -310,-140 C -350,-90 -290,10 -190,45 C -110,65 -45,40 -15,0 Z" fill="url(#wingGlow)"/>
    <path d="M -30,-40 C -80,-140 -200,-170 -250,-120 C -280,-80 -230,-10 -150,20 C -90,35 -45,15 -30,-10 Z" fill="url(#electricBlue)" opacity="0.85"/>
    <!-- Margin White Spots Left Forewing -->
    <circle cx="-320" cy="-145" r="4" fill="#ffffff"/>
    <circle cx="-335" cy="-115" r="4" fill="#ffffff"/>
    <circle cx="-325" cy="-80" r="4" fill="#ffffff"/>

    <!-- Hindwing Left -->
    <path d="M 0,10 C -70,50 -180,30 -220,110 C -240,160 -190,230 -120,240 C -60,245 -20,180 0,60 Z" fill="#090d16"/>
    <path d="M -15,15 C -65,50 -165,35 -200,105 C -220,150 -175,210 -110,220 C -55,225 -20,165 -15,60 Z" fill="url(#wingGlow)"/>
    <path d="M -25,25 C -60,55 -130,45 -160,95 C -175,130 -140,180 -90,185 C -50,190 -25,145 -25,60 Z" fill="url(#electricBlue)" opacity="0.8"/>

    <!-- RIGHT WINGS (Mirrored) -->
    <!-- Forewing Right -->
    <path d="M 0,-40 C 80,-180 260,-230 330,-150 C 380,-90 310,20 200,60 C 120,80 50,50 0,0 Z" fill="#090d16"/>
    <path d="M 15,-35 C 80,-165 245,-215 310,-140 C 350,-90 290,10 190,45 C 110,65 45,40 15,0 Z" fill="url(#wingGlow)"/>
    <path d="M 30,-40 C 80,-140 200,-170 250,-120 C 280,-80 230,-10 150,20 C 90,35 45,15 30,-10 Z" fill="url(#electricBlue)" opacity="0.85"/>
    <!-- Margin White Spots Right Forewing -->
    <circle cx="320" cy="-145" r="4" fill="#ffffff"/>
    <circle cx="335" cy="-115" r="4" fill="#ffffff"/>
    <circle cx="325" cy="-80" r="4" fill="#ffffff"/>

    <!-- Hindwing Right -->
    <path d="M 0,10 C 70,50 180,30 220,110 C 240,160 190,230 120,240 C 60,245 20,180 0,60 Z" fill="#090d16"/>
    <path d="M 15,15 C 65,50 165,35 200,105 C 220,150 175,210 110,220 C 55,225 20,165 15,60 Z" fill="url(#wingGlow)"/>
    <path d="M 25,25 C 60,55 130,45 160,95 C 175,130 140,180 90,185 C 50,190 25,145 25,60 Z" fill="url(#electricBlue)" opacity="0.8"/>

    <!-- Butterfly Central Body & Thorax -->
    <ellipse cx="0" cy="15" rx="10" ry="60" fill="#0f172a"/>
    <ellipse cx="0" cy="-45" rx="12" ry="16" fill="#1e293b"/>
    <!-- Antennae -->
    <path d="M -5,-55 Q -30,-110 -60,-120" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-60" cy="-120" r="3.5" fill="#38bdf8"/>
    <path d="M 5,-55 Q 30,-110 60,-120" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="-120" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Scientific Badge Banner -->
  <g transform="translate(30, 35)">
    <rect width="360" height="65" rx="14" fill="#02140d" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" fill="#7dd3fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INSECTA • NYMPHALIDAE</text>
    <text x="20" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" font-style="italic">Morpho peleides</text>
  </g>
  <g transform="translate(540, 35)">
    <rect width="230" height="65" rx="14" fill="#02140d" fill-opacity="0.85" stroke="#2563eb" stroke-width="1.5"/>
    <text x="18" y="28" fill="#93c5fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1">MANUEL ANTONIO &amp; OSA</text>
    <text x="18" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Mariposa Morpho Azul</text>
  </g>
</svg>
