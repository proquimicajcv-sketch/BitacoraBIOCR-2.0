<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140d"/>
      <stop offset="50%" stop-color="#06291a"/>
      <stop offset="100%" stop-color="#010a06"/>
    </linearGradient>
    <linearGradient id="viperYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="viperEye" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="viperDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#cloudNight)"/>

  <!-- Rainforest Mossy Vine / Branch in Tapantí -->
  <g filter="url(#viperDrop)">
    <path d="M 50 250 Q 350 350 500 280 T 800 320" stroke="#3f2e1e" stroke-width="38" stroke-linecap="round" fill="none"/>
    <path d="M 60 255 Q 350 355 490 285 T 790 325" stroke="#15803d" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Bothriechis schlegelii (Bocaracá de Pestañas / Oropel Morph) Coiled on Branch -->
  <g filter="url(#viperDrop)" transform="translate(160, 40)">
    <!-- Prehensile Tail Coiled Around Branch -->
    <path d="M 120 270 Q 90 310 120 340 T 150 290 Q 180 230 220 250" stroke="url(#viperYellow)" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- Sinuous Body Coils -->
    <path d="M 210 250 C 270 280 340 220 380 260 C 420 300 360 360 300 330 C 260 310 280 230 360 200 C 440 170 480 230 450 270" stroke="url(#viperYellow)" stroke-width="32" stroke-linecap="round" fill="none"/>

    <!-- Body Texture Patterns (Keeled Scales & Brown Flecks) -->
    <circle cx="320" cy="245" r="3" fill="#713f12" opacity="0.7"/>
    <circle cx="350" cy="235" r="3.5" fill="#713f12" opacity="0.6"/>
    <circle cx="280" cy="310" r="3" fill="#713f12" opacity="0.7"/>
    <circle cx="380" cy="290" r="4" fill="#713f12" opacity="0.6"/>
    <circle cx="430" cy="230" r="3.5" fill="#713f12" opacity="0.7"/>

    <!-- Triangular Viper Head Resting Forward -->
    <path d="M 440 260 C 445 220 505 210 535 240 C 555 260 550 285 530 300 C 490 315 450 295 440 260 Z" fill="url(#viperYellow)"/>

    <!-- Heat-Sensing Loral Pit (Foseta Loral) -->
    <ellipse cx="522" cy="265" rx="3.5" ry="2.5" fill="#451a03"/>

    <!-- Eye with Vertical Slit Pupil -->
    <ellipse cx="495" cy="245" rx="10" ry="9" fill="url(#viperEye)"/>
    <!-- Vertical Slit Pupil -->
    <ellipse cx="495" cy="245" rx="2.5" ry="8" fill="#020617"/>

    <!-- Horn-like Superciliary Scales ("Eyelashes" / Pestañas) -->
    <polygon points="490,237 485,220 493,234" fill="#ca8a04"/>
    <polygon points="495,236 494,216 499,235" fill="#eab308"/>
    <polygon points="502,238 506,222 505,237" fill="#ca8a04"/>
  </g>

  <!-- Scientific Badge Banner -->
  <g transform="translate(30, 35)">
    <rect width="380" height="65" rx="14" fill="#02140d" fill-opacity="0.85" stroke="#eab308" stroke-width="1.5"/>
    <text x="20" y="28" fill="#fde047" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">REPTILIA • VIPERIDAE</text>
    <text x="20" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" font-style="italic">Bothriechis schlegelii</text>
  </g>
  <g transform="translate(540, 35)">
    <rect width="230" height="65" rx="14" fill="#02140d" fill-opacity="0.85" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="18" y="28" fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PARQUE NACIONAL TAPANTÍ</text>
    <text x="18" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Bocaracá de Pestañas</text>
  </g>
</svg>
