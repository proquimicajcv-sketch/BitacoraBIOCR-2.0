<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="corcovadoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c14"/>
      <stop offset="50%" stop-color="#0b3021"/>
      <stop offset="100%" stop-color="#02140d"/>
    </linearGradient>
    <linearGradient id="tapirSkin" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tapirBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="tapirDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#corcovadoBg)"/>

  <!-- River Stream in Sirena, Corcovado -->
  <path d="M 0 490 Q 250 460 500 500 T 800 480 L 800 600 L 0 600 Z" fill="#0f382a" opacity="0.65"/>
  <path d="M 0 520 Q 250 490 500 530 T 800 510 L 800 600 L 0 600 Z" fill="#134e4a" opacity="0.4"/>

  <!-- Baird's Tapir (Danta de Costa Rica) Silhouette and Anatomy -->
  <g filter="url(#tapirDrop)" transform="translate(60, 40)">
    <!-- Back Leg Left -->
    <path d="M 230 360 C 220 420 220 480 230 520 C 235 530 255 530 260 520 C 265 480 265 420 270 380 Z" fill="#1e293b"/>
    <!-- Back Leg Right (Foreground) -->
    <path d="M 270 340 C 260 410 260 490 275 535 C 280 545 305 545 310 535 C 315 480 320 420 330 360 Z" fill="url(#tapirSkin)"/>
    <!-- Hooves -->
    <ellipse cx="293" cy="535" rx="14" ry="7" fill="#020617"/>

    <!-- Front Leg Left (Background) -->
    <path d="M 500 370 C 495 420 490 475 500 515 C 505 525 525 525 530 515 C 535 475 540 430 545 385 Z" fill="#1e293b"/>
    <!-- Front Leg Right (Foreground) -->
    <path d="M 545 350 C 540 410 535 480 545 530 C 550 542 575 542 580 530 C 585 470 590 420 600 360 Z" fill="url(#tapirSkin)"/>
    <ellipse cx="563" cy="532" rx="14" ry="7" fill="#020617"/>

    <!-- Tapir Main Massive Body (Barrel Shaped) -->
    <ellipse cx="420" cy="340" rx="170" ry="110" fill="url(#tapirSkin)"/>
    <path d="M 260 380 Q 420 430 580 370 L 560 410 Q 420 450 270 410 Z" fill="url(#tapirBelly)"/>

    <!-- Robust Neck & Head with Flexible Proboscis / Trunk -->
    <path d="M 540 270 C 570 230 630 220 670 250 C 700 275 730 320 710 360 C 690 390 650 380 620 370 C 570 360 540 340 520 310 Z" fill="url(#tapirSkin)"/>
    
    <!-- Prehensile Proboscis (Trompa prensil) -->
    <path d="M 680 300 C 720 310 745 340 735 365 C 725 380 705 380 690 360 C 680 340 670 320 670 305 Z" fill="#1e293b"/>
    <ellipse cx="725" cy="360" rx="9" ry="6" transform="rotate(25, 725, 360)" fill="#0f172a"/>

    <!-- Throat / Cream Chin Characteristic of Tapirus bairdii -->
    <path d="M 590 340 C 620 360 660 360 675 340 C 660 355 620 355 595 345 Z" fill="#cbd5e1" opacity="0.6"/>

    <!-- Ear with White Tip Diagnostic -->
    <path d="M 590 220 C 585 190 605 180 615 195 C 625 210 620 235 605 240 Z" fill="url(#tapirSkin)"/>
    <path d="M 605 183 C 612 180 618 190 614 195 Z" fill="#ffffff" opacity="0.85"/>

    <!-- Dark Expressive Eye -->
    <circle cx="645" cy="265" r="7" fill="#020617"/>
    <circle cx="643" cy="263" r="2" fill="#ffffff"/>
  </g>

  <!-- Scientific Badge Banner -->
  <g transform="translate(30, 35)">
    <rect width="360" height="65" rx="14" fill="#02140d" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="28" fill="#fcd34d" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">MAMMALIA • TAPIRIDAE</text>
    <text x="20" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" font-style="italic">Tapirus bairdii</text>
  </g>
  <g transform="translate(530, 35)">
    <rect width="240" height="65" rx="14" fill="#02140d" fill-opacity="0.85" stroke="#ef4444" stroke-width="1.5"/>
    <text x="18" y="28" fill="#fca5a5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1">PARQUE NACIONAL CORCOVADO</text>
    <text x="18" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Danta / Tapir (En Peligro)</text>
  </g>
</svg>
